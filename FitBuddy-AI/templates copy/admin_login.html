{% extends "base.html" %}


{% block content %}

<section class="card narrow">

    <p class="eyebrow">
        ADMIN
    </p>


    <h1>
        Admin Login
    </h1>


    <form
        method="post"
        action="/admin/login"
    >

        <label>

            Password

            <input
                name="password"
                type="password"
                required
            >

        </label>


        <button
            class="button primary"
            type="submit"
        >

            Open Dashboard

        </button>

    </form>

</section>

{% endblock %}
