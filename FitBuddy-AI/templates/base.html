<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ title or "FitBuddy" }}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

<header class="topbar">

    <a
        class="brand"
        href="/"
    >
        FitBuddy
    </a>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/admin/login">
            Admin
        </a>

        <a href="/docs">
            API Docs
        </a>

    </nav>

</header>


<main class="container">

    {% if error %}

    <div class="alert error">

        {{ error }}

    </div>

    {% endif %}


    {% if message %}

    <div class="alert success">

        {{ message }}

    </div>

    {% endif %}


    {% block content %}

    {% endblock %}

</main>


<footer>

    FitBuddy is an educational wellness-planning
    application, not a medical service.

</footer>

</body>

</html>
